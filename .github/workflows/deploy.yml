name: Deploy to GitHub Pages

on:
  # main ブランチへの push 時に自動デプロイ
  push:
    branches: [main]
  # 定期実行: 毎週火曜 9:10 JST（0:10 UTC）にブログ記事を取り直して再デプロイ
  # ※ GitHub Actions の cron は UTC 基準
  schedule:
    - cron: '10 0 * * 2'
  # GitHub Actions タブから手動実行も可能
  workflow_dispatch:

# GitHub Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを1つに制限（進行中のデプロイはキャンセルしない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # ubuntu-latest の自動更新による OS 変更を避ける
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      # 技術ブログ3件・写真ブログ5件を取得（失敗時は各ブログの既存データを保持）
      - name: Fetch latest tech and photo blog posts
        run: npm run fetch-posts

      # 技術ブログ全記事を RSS(?paged=N) で取得し TF-IDF の関連記事インデックスを再生成
      # （取得失敗や件数不足の場合は既存の related.json を保持）
      - name: Build related-posts index
        run: npm run build-related

      - name: Build with Astro
        env:
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

