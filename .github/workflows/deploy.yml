name: Deploy to GitHub Pages

on:
  # main ブランチへの push 時に自動デプロイ
  push:
    branches: [main]
  # 定期実行: 毎週火曜 9:10 JST（0:10 UTC）にブログ記事を取り直して再デプロイ
  # ※ GitHub Actions の cron は UTC 基準
  schedule:
    - cron: '10 0 * * 2'
  # GitHub Actions タブから手動実行も可能
  workflow_dispatch:

# GitHub Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを1つに制限（進行中のデプロイはキャンセルしない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # ブログの最新記事を取得して src/data/posts.json を生成
      - name: Fetch latest blog posts
        run: npm run fetch-posts

      - name: Build with Astro
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

